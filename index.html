<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sutariya Jewels</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #101010;
      --panel: #191919;
      --panel2: #22211e;
      --gold: #d6b66f;
      --gold2: #f0d99f;
      --text: #f8f5ee;
      --muted: #aaa69c;
      --border: #403725;
      --danger: #ffb4b4;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .container { max-width: 720px; margin: auto; }
    header {
      text-align: center; padding: 22px 12px; margin-bottom: 16px;
      border: 1px solid var(--border); border-radius: 16px;
      background: linear-gradient(145deg, #1b1b1b, #111);
    }
    .gem { color: var(--gold); font-size: 24px; margin-bottom: 5px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 2px; color: var(--gold2); }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 1px; }
    .panel, .item-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; margin-bottom: 16px;
    }
    .search-row { display: flex; gap: 9px; }
    input {
      flex: 1; min-width: 0; padding: 14px; border-radius: 10px;
      border: 1px solid #514936; background: #101010; color: var(--text);
      font-size: 16px; outline: none;
    }
    input:focus { border-color: var(--gold); }
    button {
      border: 1px solid var(--gold); border-radius: 10px; padding: 12px 15px;
      background: var(--gold); color: #17130b; font-weight: 700; font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .button-row { display: flex; gap: 9px; margin-top: 10px; }
    .button-row button { flex: 1; }
    button.secondary {
      background: #24221d; color: var(--gold2); border-color: #5a4b2e;
    }
    #reader { display: none; margin-top: 14px; overflow: hidden; border-radius: 12px; }
    #status { margin: 13px 0 0; text-align: center; color: var(--muted); font-size: 13px; }
    .item-card { padding: 20px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .item-type {
      display: inline-block; padding: 5px 9px; border-radius: 20px;
      color: var(--gold2); background: #30291b; font-size: 10px;
      letter-spacing: 1px; font-weight: 800;
    }
    h2 { margin: 12px 0 7px; font-size: 23px; line-height: 1.25; }
    h3 { margin: 0; font-size: 15px; }
    .display-id { margin: 0 0 16px; color: var(--gold2); font-size: 13px; overflow-wrap: anywhere; }
    .details { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; margin: 16px 0; }
    .detail { background: var(--panel2); border: 1px solid #363127; border-radius: 10px; padding: 11px; min-width: 0; }
    .detail-label { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
    .detail-value { display: block; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
    .selling-prices { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; margin-top: 16px; }
    .price-box { border: 1px solid #74603a; border-radius: 12px; padding: 14px; background: #211e18; min-width: 0; }
    .price-box.retail { background: var(--gold); color: #17130b; border-color: var(--gold); }
    .price-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .9px; opacity: .8; margin-bottom: 7px; }
    .price-value { display: block; font-size: 22px; font-weight: 800; overflow-wrap: anywhere; }
    .per-carat { display: block; margin-top: 5px; font-size: 12px; opacity: .85; }
    .section-title { margin: 22px 0 10px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--gold2); }
    .linked-card { margin-top: 10px; padding: 13px; border: 1px solid #403725; border-radius: 12px; background: #151515; }
    .linked-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .linked-name { font-size: 14px; font-weight: 650; margin-top: 7px; }
    .id-link {
      display: inline-block; margin-top: 8px; background: transparent; color: var(--gold2);
      border: 1px solid #76613a; padding: 8px 10px; text-align: left;
      font-size: 12px; overflow-wrap: anywhere; max-width: 100%;
    }
    .back-button { margin-bottom: 12px; background: #25231f; color: var(--gold2); }
    .error { padding: 15px; border: 1px solid #713b3b; border-radius: 12px; color: var(--danger); background: #291919; }
    .empty { color: var(--muted); font-size: 13px; }
    footer { text-align: center; color: #77736a; font-size: 11px; padding: 12px; }
    @media(max-width:480px) {
      body { padding: 10px; }
      .search-row { flex-direction: column; }
      .details, .selling-prices { grid-template-columns: repeat(2,minmax(0,1fr)); }
      h1 { font-size: 21px; }
      .price-value { font-size: 19px; }
      .panel, .item-card { padding: 14px; }
    }
  </style>
</head>
<body>
<main class="container">
  <header>
    <div class="gem">◇</div>
    <h1>SUTARIYA JEWELS</h1>
    <p class="subtitle">JEWELS &amp; DIAMONDS</p>
  </header>

  <section class="panel">
    <form id="searchForm">
      <div class="search-row">
        <input id="itemCode" type="text" placeholder="Scan or enter item ID"
          autocomplete="off" autocapitalize="characters">
        <button id="searchButton" type="submit">Search</button>
      </div>
    </form>
    <div class="button-row">
      <button id="startCamera" type="button">Scan QR / Barcode</button>
      <button id="stopCamera" class="secondary" type="button" disabled>Stop Camera</button>
    </div>
    <div id="reader"></div>
    <p id="status">Enter an ID or start the camera scanner.</p>
  </section>

  <section id="results" aria-live="polite"></section>
  <footer>Sutariya Jewels &amp; Diamond Inc.</footer>
</main>

<script>
"use strict";

const API_URL = "https://script.google.com/macros/s/AKfycbxv4btjp3Uc5rDB1reFRN2Ykd0lYviCw_cEtkGj6Uf44Cos9oWtKwo7wVVWBoRKys1X/exec";
const $ = id => document.getElementById(id);
const input = $("itemCode");
const statusEl = $("status");
const resultsEl = $("results");
const searchButton = $("searchButton");
const startCameraButton = $("startCamera");
const stopCameraButton = $("stopCamera");
const readerEl = $("reader");

let qrScanner = null;
let cameraRunning = false;
let lookupInProgress = false;
let currentResponse = null;
const responseHistory = [];

$("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  responseHistory.length = 0;
  lookupItem(input.value);
});
startCameraButton.addEventListener("click", startCamera);
stopCameraButton.addEventListener("click", stopCamera);

function setStatus(message) {
  statusEl.textContent = message;
}

function norm(value) {
  return String(value == null ? "" : value).toLowerCase().replace(/[^a-z0-9]/g, "");
}

function getValue(record, aliases) {
  if (!record) return "";
  const keys = Object.keys(record);
  for (const alias of aliases) {
    const key = keys.find(k => norm(k) === norm(alias));
    if (key && String(record[key] == null ? "" : record[key]).trim() !== "") {
      return record[key];
    }
  }
  return "";
}

function formatCurrency(value) {
  if (value === null || value === undefined || value === "" || !Number.isFinite(Number(value))) return "";
  return Number(value).toLocaleString("en-CA", { style: "currency", currency: "CAD" });
}

function appendText(parent, tag, className, value) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  element.textContent = value == null ? "" : String(value);
  parent.appendChild(element);
  return element;
}

async function lookupItem(rawCode, fromLinkedId = false) {
  const code = String(rawCode || "").trim();
  if (!code) {
    setStatus("Please enter an item ID.");
    input.focus();
    return;
  }
  if (lookupInProgress) return;

  if (fromLinkedId && currentResponse) responseHistory.push(currentResponse);

  lookupInProgress = true;
  searchButton.disabled = true;
  input.value = code;
  resultsEl.replaceChildren();
  setStatus("Searching for " + code + "...");

  if (cameraRunning) await stopCamera();

  const callbackName = "sutariyaCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
  const script = document.createElement("script");
  let finished = false;
  let timeoutId;

  function cleanup() {
    if (finished) return;
    finished = true;
    clearTimeout(timeoutId);
    lookupInProgress = false;
    searchButton.disabled = false;
    delete window[callbackName];
    script.remove();
  }

  timeoutId = setTimeout(() => {
    cleanup();
    showError("The inventory server took too long to respond. Please try again.");
  }, 15000);

  window[callbackName] = response => {
    cleanup();
    if (!response || response.found !== true) {
      if (fromLinkedId) responseHistory.pop();
      showError(response && response.message ? response.message : "Item not found. Check the ID.");
      return;
    }
    currentResponse = response;
    renderItem(response);
    setStatus("Ready for the next item.");
  };

  script.onerror = () => {
    cleanup();
    if (fromLinkedId) responseHistory.pop();
    showError("Connection error. Check your internet connection or scanner deployment.");
  };

  script.src = API_URL + "?api=1&code=" + encodeURIComponent(code) +
    "&callback=" + encodeURIComponent(callbackName) + "&_=" + Date.now();
  document.body.appendChild(script);
}

function showError(message) {
  resultsEl.replaceChildren();
  appendText(resultsEl, "div", "error", message);
  setStatus("Lookup unsuccessful.");
}

function renderDetails(parent, record, recordType) {
  const fields = recordType === "DIAMOND" ? [
    ["Shape", ["Shape"]],
    ["Carat", ["Target CT", "Carat", "Carats", "Weight"]],
    ["Size", ["Target MM", "Size MM", "MM"]],
    ["Colour", ["Color", "Colour"]],
    ["Clarity", ["Clarity"]],
    ["Certificate", ["Certificate", "Certificate Number", "Cert No", "Lab"]],
    ["Type", ["Type", "Diamond Type"]]
  ] : [
    ["Product", ["Product", "Name", "Description"]],
    ["Size", ["Size", "Ring Size"]],
    ["Gold", ["Gold", "Gold Karat", "Karat", "Metal"]],
    ["Main Stone", ["Main Stone", "Stone", "Center Stone"]],
    ["Colour", ["Color", "Colour"]],
    ["Clarity", ["Clarity"]],
    ["Total Carat Weight", ["Stone Wt Total", "Total Carat Weight", "CTW"]],
    ["Type", ["Type", "Product Type"]]
  ];

  const grid = document.createElement("div");
  grid.className = "details";

  fields.forEach(([label, aliases]) => {
    const value = getValue(record, aliases);
    if (!value) return;
    const detail = document.createElement("div");
    detail.className = "detail";
    appendText(detail, "span", "detail-label", label);
    appendText(detail, "span", "detail-value", value);
    grid.appendChild(detail);
  });

  if (grid.children.length) parent.appendChild(grid);
}

function renderSellingPrices(parent, pricing, isDiamond) {
  if (!pricing) return;

  const section = document.createElement("div");
  section.className = "selling-prices";
  const entries = [
    { label: "Wholesale", total: pricing.wholesalePrice, perCt: pricing.wholesalePerCarat },
    { label: "Retail", total: pricing.retailPrice, perCt: pricing.retailPerCarat }
  ];

  entries.forEach((entry, index) => {
    const box = document.createElement("div");
    box.className = "price-box" + (index === 1 ? " retail" : "");
    appendText(box, "span", "price-label", entry.label + " price");

    if (entry.total !== null && entry.total !== undefined && entry.total !== "") {
      appendText(box, "span", "price-value", formatCurrency(entry.total));
    } else {
      appendText(box, "span", "price-value", "Not set");
    }

    if (isDiamond && entry.perCt !== null && entry.perCt !== undefined) {
      appendText(box, "span", "per-carat", formatCurrency(entry.perCt) + " / ct");
    }

    section.appendChild(box);
  });

  parent.appendChild(section);
}

function makeLinkedCard(parent, linked, label) {
  const box = document.createElement("div");
  box.className = "linked-card";

  const top = document.createElement("div");
  top.className = "linked-top";
  appendText(top, "span", "item-type", label);
  appendText(top, "span", "empty", getValue(linked.record, ["Shape", "Product", "Name"]) || "");
  box.appendChild(top);

  const title = getValue(linked.record, ["Product", "Name", "Shape", "Description"]) || label;
  appendText(box, "div", "linked-name", title);

  const idButton = appendText(box, "button", "id-link", linked.displayId || linked.id || "Open details");
  idButton.type = "button";
  idButton.addEventListener("click", () => lookupItem(linked.id || linked.displayId, true));

  parent.appendChild(box);
}

function renderItem(response) {
  resultsEl.replaceChildren();

  const record = response.record || {};
  const type = String(response.recordType || "ITEM").toUpperCase();
  const isDiamond = type === "DIAMOND";

  const card = document.createElement("article");
  card.className = "item-card";

  if (responseHistory.length) {
    const back = appendText(card, "button", "back-button", "← Back to previous item");
    back.type = "button";
    back.addEventListener("click", () => {
      const previous = responseHistory.pop();
      if (previous) {
        currentResponse = previous;
        input.value = previous.id || "";
        renderItem(previous);
        setStatus("Returned to previous item.");
      }
    });
  }

  const title = isDiamond
    ? (getValue(record, ["Shape"]) || "Diamond")
    : (getValue(record, ["Product", "Name", "Description"]) || "Jewelry");

  const top = document.createElement("div");
  top.className = "topline";
  appendText(top, "span", "item-type", isDiamond ? "DIAMOND" : "JEWELRY");
  appendText(top, "span", "empty", isDiamond ? "LOOSE / LINKED STONE" : "JEWELRY ITEM");
  card.appendChild(top);

  appendText(card, "h2", "", title);
  appendText(card, "p", "display-id", "ID: " + (response.displayId || response.id || ""));

  // Product photos are intentionally omitted from the client-facing view.
  renderDetails(card, record, type);
  renderSellingPrices(card, response.pricing, isDiamond);

  if (!isDiamond && Array.isArray(response.linkedDiamonds) && response.linkedDiamonds.length) {
    appendText(card, "h3", "section-title", "Linked diamonds");
    response.linkedDiamonds.forEach(diamond => makeLinkedCard(card, diamond, "DIAMOND"));
  }

  if (isDiamond && response.linkedJewelry) {
    appendText(card, "h3", "section-title", "Used in jewelry");
    makeLinkedCard(card, response.linkedJewelry, "JEWELRY");
  }

  resultsEl.appendChild(card);
}

async function startCamera() {
  if (cameraRunning) return;

  if (typeof Html5Qrcode === "undefined") {
    setStatus("Scanner library did not load. Refresh the page and try again.");
    return;
  }

  try {
    setStatus("Opening camera...");
    readerEl.style.display = "block";
    if (!qrScanner) qrScanner = new Html5Qrcode("reader");

    await qrScanner.start(
      { facingMode: "environment" },
      { fps: 12, qrbox: { width: 240, height: 170 } },
      async decodedText => {
        const code = String(decodedText || "").trim();
        if (!code || lookupInProgress) return;
        await stopCamera();
        responseHistory.length = 0;
        lookupItem(code);
      },
      () => {}
    );

    cameraRunning = true;
    startCameraButton.disabled = true;
    stopCameraButton.disabled = false;
    setStatus("Camera active. Point it at the QR code or barcode.");
  } catch (error) {
    console.error(error);
    cameraRunning = false;
    readerEl.style.display = "none";
    startCameraButton.disabled = false;
    stopCameraButton.disabled = true;
    setStatus("Unable to access camera. Use HTTPS and allow camera permission.");
  }
}

async function stopCamera() {
  if (!qrScanner) return;

  try {
    if (cameraRunning) await qrScanner.stop();
    await qrScanner.clear();
  } catch (error) {
    console.warn("Camera stop:", error);
  } finally {
    cameraRunning = false;
    qrScanner = null;
    readerEl.style.display = "none";
    startCameraButton.disabled = false;
    stopCameraButton.disabled = true;
  }
}
</script>
</body>
</html>
