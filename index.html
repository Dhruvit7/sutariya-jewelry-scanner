
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sutariya Jewels Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: Arial, sans-serif;
      color: #f5f5f5; background: #111;
    }
    .container { max-width: 650px; margin: auto; }
    h1 { color: #d6b46a; text-align: center; }
    .sub { text-align: center; color: #bbb; }
    input, button {
      width: 100%; padding: 13px; margin: 7px 0;
      border-radius: 8px; font-size: 16px;
    }
    input { border: 1px solid #555; background: #222; color: white; }
    button {
      border: 0; background: #d6b46a; color: #111;
      font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #333; color: white; }
    #reader { margin-top: 12px; }
    #message { margin: 12px 0; color: #ffd980; overflow-wrap: anywhere; }
    .card {
      background: #1d1d1d; border: 1px solid #444;
      border-radius: 12px; padding: 16px; margin-top: 18px;
    }
    .card h2 { color: #d6b46a; margin-top: 0; }
    .id { font-size: 22px; font-weight: bold; color: #d6b46a; }
    .field {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 9px 0; border-bottom: 1px solid #333;
    }
    .field span:first-child { color: #aaa; }
    .field span:last-child { text-align: right; overflow-wrap: anywhere; }
    .price { font-size: 19px; color: #d6b46a; font-weight: bold; }
    img.product-photo { max-width: 100%; max-height: 300px; object-fit: contain; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>SUTARIYA JEWELS</h1>
  <p class="sub">Jewelry & Diamond Inventory Scanner</p>

  <input id="searchInput" placeholder="Enter jewelry or diamond ID (e.g. SJD-O07 or SB013)">
  <button id="searchButton" type="button">Search ID</button>
  <button id="cameraButton" class="secondary" type="button">Start Camera Scanner</button>
  <button id="stopButton" class="secondary" type="button">Stop Camera</button>
  <div id="reader"></div>
  <div id="message" role="status"></div>
  <div id="result"></div>
</div>

<script>
"use strict";

const API_URL =
  "https://script.google.com/macros/s/AKfycbxv4btjp3Uc5rDB1reFRN2Ykd0lYviCw_cEtkGj6Uf44Cos9oWtKwo7wVVWBoRKys1X/exec";

let html5QrCode = null;
let scannerRunning = false;

function setMessage(message) {
  document.getElementById("message").textContent = message || "";
}

function clean(value) {
  if (value === null || value === undefined || value === "") return "—";
  if (typeof value === "object") return JSON.stringify(value);
  return String(value);
}

function normalizedKey(key) {
  return String(key).toLowerCase().replace(/[^a-z0-9]/g, "");
}

function isPrivateField(key) {
  const k = normalizedKey(key);
  return [
    "cost", "margin", "profit", "landedcost", "finalprice",
    "priceperct", "supplierprice", "purchaseprice", "buyprice",
    "wholesaleprice", "retailprice", "sellingprice", "costcad",
    "finalpricecad", "finalpriceusd"
  ].some(term => k.includes(term));
}

function isPriceField(key) {
  const k = normalizedKey(key);
  return k.includes("wholesaleprice") || k.includes("retailprice");
}

function displayIdWithCostKey(id, data) {
  const originalId = String(id || "");
  const type = String(data.recordType || data.type || "").toUpperCase();

  if (type !== "DIAMOND") return originalId;

  const raw = data.landedCostPerCarat;
  if (raw === null || raw === undefined || String(raw).trim() === "") {
    return originalId;
  }

  const cost = Number(raw);
  if (!Number.isFinite(cost) || cost < 0) return originalId;

  return originalId + "-K" + Math.round(cost * 100);
}

function findValue(data, names) {
  const wanted = names.map(normalizedKey);
  for (const key of Object.keys(data || {})) {
    if (wanted.includes(normalizedKey(key))) return data[key];
  }
  return undefined;
}

function addField(parent, label, value, className) {
  if (value === undefined || value === null || value === "") return;

  const row = document.createElement("div");
  row.className = "field";

  const left = document.createElement("span");
  left.textContent = label;

  const right = document.createElement("span");
  right.textContent = clean(value);
  if (className) right.className = className;

  row.append(left, right);
  parent.appendChild(row);
}

function renderItem(data) {
  const result = document.getElementById("result");
  result.replaceChildren();

  if (!data || typeof data !== "object") {
    setMessage("No item details were returned by the API.");
    return;
  }

  const record = data.item || data.data || data.record || data;
  if (!record || typeof record !== "object") {
    setMessage("The API response does not contain an item record.");
    return;
  }

  const card = document.createElement("section");
  card.className = "card";

  const heading = document.createElement("h2");
  heading.textContent = "Item Details";
  card.appendChild(heading);

  const originalId = findValue(record, [
    "ID", "Stone ID", "Jewelry ID", "Barcode", "Product ID"
  ]) || findValue(data, ["ID", "Stone ID", "Jewelry ID", "Barcode"]);

  const idElement = document.createElement("p");
  idElement.className = "id";
  idElement.textContent = displayIdWithCostKey(originalId, record);
  card.appendChild(idElement);

  const photo = findValue(record, ["Photo", "Image", "Image URL", "Photo URL"]);
  if (photo && /^https?:\/\//i.test(String(photo))) {
    const img = document.createElement("img");
    img.className = "product-photo";
    img.src = String(photo);
    img.alt = "Jewelry or diamond";
    img.onerror = () => img.remove();
    card.appendChild(img);
  }

  const preferredOrder = [
    "Product", "Shape", "Type", "Size", "Gold", "Main Stone",
    "Color", "Clarity", "Stone Wt Total", "Target CT", "Target MM",
    "Jewelry ID", "Stone ID", "Notes", "Location", "Status",
    "Wholesale price", "Retail price"
  ];

  const keys = Object.keys(record);
  const ordered = [];

  preferredOrder.forEach(name => {
    const key = keys.find(k => normalizedKey(k) === normalizedKey(name));
    if (key && !ordered.includes(key)) ordered.push(key);
  });

  keys.forEach(key => {
    if (!ordered.includes(key)) ordered.push(key);
  });

  ordered.forEach(key => {
    if (isPrivateField(key)) return;
    if (normalizedKey(key) === "photo" ||
        normalizedKey(key) === "image" ||
        normalizedKey(key) === "imageurl" ||
        normalizedKey(key) === "photourl") return;
    if (normalizedKey(key) === "id" ||
        normalizedKey(key) === "stoneid" ||
        normalizedKey(key) === "jewelryid" ||
        normalizedKey(key) === "barcode") return;

    const value = record[key];
    if (value === undefined || value === null || value === "") return;

    addField(card, key, value, isPriceField(key) ? "price" : "");
  });

  const linked = findValue(record, [
    "Linked Diamonds", "Diamonds", "Linked Stones", "Stones"
  ]);

  if (Array.isArray(linked) && linked.length) {
    const linkedHeading = document.createElement("h2");
    linkedHeading.textContent = "Linked Diamonds";
    card.appendChild(linkedHeading);

    linked.forEach((stone, index) => {
      const section = document.createElement("div");
      section.style.borderTop = "1px solid #444";
      section.style.paddingTop = "8px";

      const title = document.createElement("strong");
      title.textContent = "Stone " + (index + 1);
      section.appendChild(title);

      if (stone && typeof stone === "object") {
        Object.keys(stone).forEach(key => {
          if (!isPrivateField(key)) addField(section, key, stone[key]);
        });
      } else {
        section.appendChild(document.createTextNode(clean(stone)));
      }

      card.appendChild(section);
    });
  }

  result.appendChild(card);
  setMessage("Item found.");
}

/* Make the function globally accessible for all callbacks. */
window.renderItem = renderItem;

function apiLookup(code) {
  const searchCode = String(code || "").trim();
  if (!searchCode) {
    setMessage("Enter an ID to search.");
    return;
  }

  setMessage("Searching inventory...");
  document.getElementById("result").replaceChildren();

  const callbackName = "__sutariyaCallback_" +
    Date.now() + "_" + Math.floor(Math.random() * 100000);

  const script = document.createElement("script");
  let finished = false;

  const cleanup = () => {
    if (finished) return;
    finished = true;
    clearTimeout(timeout);
    delete window[callbackName];
    script.remove();
  };

  const timeout = setTimeout(() => {
    cleanup();
    setMessage("Inventory request timed out. Check the Apps Script deployment.");
  }, 20000);

  window[callbackName] = function(response) {
    cleanup();

    if (!response || response.found === false) {
      setMessage("No item found for ID: " + searchCode);
      return;
    }

    const record = response.item || response.data || response.record;
    if (response.found === true && !record) {
      setMessage("The API found the ID but returned no item details. Check the API response format.");
      return;
    }

    if (record) {
      renderItem({
        ...response,
        item: record,
        recordType: response.recordType || record.recordType || record.type
      });
    } else {
      renderItem(response);
    }
  };

  script.onerror = function() {
    cleanup();
    setMessage("Inventory connection failed. The API script could not load.");
  };

  const separator = API_URL.includes("?") ? "&" : "?";
  script.src = API_URL + separator +
    "api=1&code=" + encodeURIComponent(searchCode) +
    "&callback=" + encodeURIComponent(callbackName);

  document.body.appendChild(script);
}

window.apiLookup = apiLookup;

function handleSearch() {
  apiLookup(document.getElementById("searchInput").value);
}

document.getElementById("searchButton").addEventListener("click", handleSearch);
document.getElementById("searchInput").addEventListener("keydown", event => {
  if (event.key === "Enter") handleSearch();
});

async function startCamera() {
  if (!window.Html5Qrcode) {
    setMessage("Camera scanner library failed to load. Check your internet connection.");
    return;
  }

  if (scannerRunning) return;

  try {
    html5QrCode = new Html5Qrcode("reader");
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      decodedText => {
        document.getElementById("searchInput").value = decodedText.trim();
        stopCamera();
        apiLookup(decodedText.trim());
      },
      () => {}
    );
    scannerRunning = true;
    setMessage("Camera scanner started. Point it at the item's QR code.");
  } catch (error) {
    setMessage("Cannot start camera. Allow camera access and use HTTPS. " +
      (error && error.message ? error.message : ""));
  }
}

async function stopCamera() {
  if (!html5QrCode || !scannerRunning) return;

  try {
    await html5QrCode.stop();
    await html5QrCode.clear();
  } catch (error) {
    console.warn("Camera stop:", error);
  } finally {
    scannerRunning = false;
    html5QrCode = null;
  }
}

document.getElementById("cameraButton").addEventListener("click", startCamera);
document.getElementById("stopButton").addEventListener("click", stopCamera);
</script>
</body>
</html>
