
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sutariya Jewels Inventory</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --gold: #c6a15b;
      --dark: #151515;
      --muted: #666;
      --border: #e6e0d5;
      --background: #f7f6f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--background);
      color: var(--dark);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container { max-width: 760px; margin: 0 auto; }

    header {
      text-align: center;
      padding: 20px 10px;
      margin-bottom: 18px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    h1 { margin: 0 0 7px; font-size: 26px; letter-spacing: 1px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }

    .panel, .item-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .search-row { display: flex; gap: 8px; }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--dark);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: wait; }

    .gold-button { background: var(--gold); color: #17130c; }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 12px;
    }

    .button-row button { flex: 1; }

    #reader {
      width: 100%;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 10px;
    }

    #status {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #results:empty { display: none; }

    .item-card h2 { font-size: 19px; margin: 0 0 5px; }

    .item-type {
      display: inline-block;
      margin: 0 0 12px;
      padding: 5px 9px;
      border-radius: 20px;
      background: #f3ead7;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: .6px;
    }

    .display-id {
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
      margin: 0 0 14px;
    }

    .item-photo {
      display: block;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: #fafafa;
      border-radius: 9px;
      margin: 0 0 14px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin: 14px 0;
    }

    .detail {
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 8px;
      min-width: 0;
    }

    .detail-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .detail-value {
      font-size: 14px;
      font-weight: bold;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .selling-prices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .price-box {
      border: 1px solid var(--gold);
      border-radius: 10px;
      padding: 14px 10px;
      background: #fffdf8;
      min-width: 0;
    }

    .price-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .price-value {
      display: block;
      font-size: 20px;
      font-weight: bold;
      overflow-wrap: anywhere;
      color: #17130c;
    }

    .section-title {
      border-top: 1px solid var(--border);
      padding-top: 15px;
      margin: 18px 0 10px;
      font-size: 16px;
    }

    .linked-card {
      border: 1px solid #eee;
      padding: 13px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .linked-card .display-id { font-size: 14px; margin-top: 8px; }

    .error {
      padding: 14px;
      background: #fff0ee;
      color: #9a271c;
      border-radius: 8px;
    }

    .empty-price { color: #888; font-size: 13px; font-weight: normal; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 12px;
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .search-row { flex-direction: column; }
      .search-row button { width: 100%; }
      .price-value { font-size: 17px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>SUTARIYA JEWELS</h1>
      <p class="subtitle">Jewelry &amp; Diamond Inventory Scanner</p>
    </header>

    <section class="panel">
      <form id="searchForm">
        <div class="search-row">
          <input id="itemCode" type="text"
            placeholder="Enter item ID, e.g. SB013 or SJD-O07"
            autocomplete="off" autocapitalize="characters">
          <button id="searchButton" type="submit">Search</button>
        </div>
      </form>

      <div class="button-row">
        <button id="startCamera" class="gold-button" type="button">
          Start Camera Scanner
        </button>
        <button id="stopCamera" type="button" disabled>Stop Camera</button>
      </div>

      <div id="reader"></div>
      <p id="status" role="status">Enter an ID or start the camera scanner.</p>
    </section>

    <section id="results" aria-live="polite"></section>
    <footer>Sutariya Jewels &amp; Diamond Inc.</footer>
  </main>

  <script>
    "use strict";

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxv4btjp3Uc5rDB1reFRN2Ykd0lYviCw_cEtkGj6Uf44Cos9oWtKwo7wVVWBoRKys1X/exec";

    const input = document.getElementById("itemCode");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const searchButton = document.getElementById("searchButton");
    const startCameraButton = document.getElementById("startCamera");
    const stopCameraButton = document.getElementById("stopCamera");

    let html5QrCode = null;
    let cameraRunning = false;
    let lookupInProgress = false;
    let lastScannedCode = "";

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      lookupItem(input.value);
    });

    startCameraButton.addEventListener("click", startCamera);
    stopCameraButton.addEventListener("click", stopCamera);

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function lookupItem(rawCode) {
      const code = String(rawCode || "").trim();

      if (!code) {
        setStatus("Enter an item ID first.");
        input.focus();
        return;
      }

      if (lookupInProgress) return;

      lookupInProgress = true;
      searchButton.disabled = true;
      resultsEl.replaceChildren();
      setStatus("Searching inventory for " + code + "...");

      const callbackName =
        "sutariyaCallback_" + Date.now() + "_" +
        Math.floor(Math.random() * 100000);

      const script = document.createElement("script");
      let finished = false;

      function cleanup() {
        if (finished) return;
        finished = true;
        window.clearTimeout(timeout);
        lookupInProgress = false;
        searchButton.disabled = false;
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      const timeout = window.setTimeout(() => {
        cleanup();
        showError("The inventory server did not respond. Please try again.");
      }, 20000);

      window[callbackName] = response => {
        cleanup();

        // Diagnostic: view the returned pricing in the browser console.
        console.log("Sutariya API response:", response);
        console.log("Sutariya API pricing:", response && response.pricing);

        if (!response || response.found !== true) {
          showError(
            response && response.message
              ? response.message
              : "No item found. Check the ID."
          );
          return;
        }

        renderItem(response);
        setStatus("Item found: " + (response.displayId || response.id || code));
      };

      script.onerror = () => {
        cleanup();
        showError(
          "Could not connect to the inventory server. Check the Apps Script deployment."
        );
      };

      script.src = API_URL +
        "?api=1&code=" + encodeURIComponent(code) +
        "&callback=" + encodeURIComponent(callbackName) +
        "&_=" + Date.now();

      document.body.appendChild(script);
    }

    function showError(message) {
      resultsEl.replaceChildren();
      const box = document.createElement("div");
      box.className = "error";
      box.textContent = message;
      resultsEl.appendChild(box);
      setStatus("Search unsuccessful.");
    }

    function normalizeField(value) {
      return String(value == null ? "" : value)
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    function isPrivateField(key) {
      const field = normalizeField(key);
      const blocked = [
        "cost", "costcad", "costusd", "margin",
        "wholesalemargin", "retailmargin", "profit",
        "wholesaleprofit", "retailprofit", "landedcost",
        "finalprice", "finalpricecad", "finalpriceusd",
        "priceperct", "wholesaleprice", "retailprice",
        "sellingprice"
      ];
      return blocked.some(term => field === term || field.startsWith(term));
    }

    function appendText(parent, tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text == null ? "" : String(text);
      parent.appendChild(element);
      return element;
    }

    function appendImage(parent, url) {
      if (!url || !/^https?:\/\//i.test(String(url))) return;
      const image = document.createElement("img");
      image.className = "item-photo";
      image.src = url;
      image.alt = "Jewelry or diamond";
      image.loading = "lazy";
      image.referrerPolicy = "no-referrer";
      image.onerror = () => image.remove();
      parent.appendChild(image);
    }

    function renderDetails(parent, record) {
      const details = document.createElement("div");
      details.className = "details";

      Object.entries(record || {}).forEach(([key, value]) => {
        if (isPrivateField(key)) return;
        if (value === null || value === undefined || String(value).trim() === "") return;

        const normalized = normalizeField(key);
        if ([
          "photo", "photourl", "image", "imageurl", "barcodeimage"
        ].includes(normalized)) return;

        const detail = document.createElement("div");
        detail.className = "detail";
        appendText(detail, "span", "detail-label", key);
        appendText(detail, "span", "detail-value", value);
        details.appendChild(detail);
      });

      if (details.children.length) parent.appendChild(details);
    }

    // Supports camelCase API fields and common alternative header spellings.
    function getPrice(pricing, names) {
      if (!pricing || typeof pricing !== "object") return null;

      const wanted = names.map(normalizeField);
      for (const [key, value] of Object.entries(pricing)) {
        if (!wanted.includes(normalizeField(key))) continue;
        if (value === null || value === undefined || String(value).trim() === "") {
          return null;
        }
        return value;
      }
      return null;
    }

    function formatSellingPrice(value) {
      if (value === null || value === undefined || value === "") return "";

      if (typeof value === "number" && Number.isFinite(value)) {
        return value.toLocaleString("en-CA", {
          style: "currency",
          currency: "CAD"
        });
      }

      let text = String(value).trim().replace(/[$\s]/g, "");

      // Accept both 1,234.56 and 1234,56 number formats.
      if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(text)) {
        text = text.replace(/,/g, "");
      } else if (/^-?\d+,\d{1,2}$/.test(text)) {
        text = text.replace(",", ".");
      }

      const amount = Number(text);
      if (!Number.isFinite(amount)) return String(value);

      return amount.toLocaleString("en-CA", {
        style: "currency",
        currency: "CAD"
      });
    }

    function renderSellingPrices(parent, pricing) {
      console.log("Rendering selling prices:", pricing);

      const section = document.createElement("div");
      section.className = "selling-prices";

      const values = [
        {
          label: "Wholesale Price",
          value: getPrice(pricing, ["wholesalePrice", "wholesale price"])
        },
        {
          label: "Retail Price",
          value: getPrice(pricing, ["retailPrice", "retail price"])
        }
      ];

      values.forEach(({ label, value }) => {
        const box = document.createElement("div");
        box.className = "price-box";
        appendText(box, "span", "price-label", label);

        if (value === null) {
          appendText(box, "span", "empty-price", "Not set");
        } else {
          appendText(box, "span", "price-value", formatSellingPrice(value));
        }

        section.appendChild(box);
      });

      parent.appendChild(section);
    }

    function renderItem(response) {
      const record = response.record || response.item || response.data || response;
      const card = document.createElement("article");
      card.className = "item-card";

      const recordType = String(
        response.recordType || record.recordType || record.type || "ITEM"
      ).toUpperCase();

      appendText(card, "span", "item-type",
        recordType === "DIAMOND" ? "DIAMOND" :
        recordType === "JEWELRY" ? "JEWELRY" : "ITEM");

      const title = getValue(record, ["Product", "Name", "Description", "Shape", "Type"]) ||
        (recordType === "DIAMOND" ? "Diamond Details" : "Jewelry Details");

      appendText(card, "h2", "", title);
      appendText(card, "p", "display-id", "ID: " + (response.displayId || response.id || ""));

      appendImage(card, response.photoUrl ||
        getValue(record, ["Photo URL", "Photo", "Image URL", "Image"]));

      renderDetails(card, record);

      // Prices are top-level properties in the confirmed API response.
      renderSellingPrices(card, response.pricing);

      if (response.linkedJewelry) {
        appendText(card, "h3", "section-title", "Linked Jewelry");
        renderLinkedRecord(card, response.linkedJewelry);
      }

      const linkedDiamonds = response.linkedDiamonds || record.linkedDiamonds || [];
      if (Array.isArray(linkedDiamonds) && linkedDiamonds.length) {
        appendText(card, "h3", "section-title", "Linked Diamonds");
        linkedDiamonds.forEach(diamond => renderLinkedRecord(card, diamond));
      }

      resultsEl.replaceChildren(card);
    }

    function renderLinkedRecord(parent, response) {
      const record = response.record || response.item || response.data || response;
      const box = document.createElement("div");
      box.className = "linked-card";

      const type = String(response.recordType || record.recordType || "ITEM").toUpperCase();
      appendText(box, "span", "item-type",
        type === "DIAMOND" ? "DIAMOND" :
        type === "JEWELRY" ? "JEWELRY" : "ITEM");

      appendText(box, "h2", "",
        getValue(record, ["Product", "Name", "Description", "Shape", "Type"]) || type);

      appendText(box, "p", "display-id", "ID: " + (response.displayId || response.id || ""));

      appendImage(box, response.photoUrl ||
        getValue(record, ["Photo URL", "Photo", "Image URL", "Image"]));

      renderDetails(box, record);
      renderSellingPrices(box, response.pricing);
      parent.appendChild(box);
    }

    function getValue(record, candidates) {
      if (!record) return "";
      const wanted = candidates.map(normalizeField);

      for (const [key, value] of Object.entries(record)) {
        if (wanted.includes(normalizeField(key)) &&
            value !== null && value !== undefined &&
            String(value).trim() !== "") {
          return String(value);
        }
      }
      return "";
    }

    async function startCamera() {
      if (cameraRunning) return;

      if (typeof Html5Qrcode === "undefined") {
        setStatus("Camera scanner library failed to load. Refresh the page.");
        return;
      }

      try {
        setStatus("Requesting camera permission...");
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 240, height: 180 }, aspectRatio: 1.333 },
          decodedText => {
            const code = String(decodedText || "").trim();
            if (!code || code === lastScannedCode || lookupInProgress) return;
            lastScannedCode = code;
            input.value = code;
            lookupItem(code);
          },
          () => {}
        );

        cameraRunning = true;
        startCameraButton.disabled = true;
        stopCameraButton.disabled = false;
        setStatus("Camera active. Point it at an item's QR code.");
      } catch (error) {
        console.error("Camera error:", error);
        setStatus("Could not start the camera. Allow camera access and use HTTPS. " +
          (error && error.message ? error.message : ""));
      }
    }

    async function stopCamera() {
      if (!html5QrCode || !cameraRunning) return;

      try {
        await html5QrCode.stop();
        await html5QrCode.clear();
      } catch (error) {
        console.warn("Camera stop:", error);
      }

      cameraRunning = false;
      html5QrCode = null;
      startCameraButton.disabled = false;
      stopCameraButton.disabled = true;
      lastScannedCode = "";
      setStatus("Camera stopped. Enter an ID or start scanning again.");
    }
  </script>
</body>
</html>
