
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Sutariya Jewels | Inventory</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--gold:#c5a05a;--light:#e7cc91;--bg:#101010;--panel:#202020;--text:#f7f5f0;--muted:#b8b5ad;--line:#393939;--green:#81d5a8;--red:#ff9b91}
*{box-sizing:border-box}
body{margin:0;padding:16px 12px 32px;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
main{max-width:680px;margin:auto}
header{display:flex;align-items:center;gap:12px;padding:8px 2px 20px}
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--gold);color:#141414;font-size:24px;font-weight:800}
h1{margin:0;color:var(--light);font-size:20px;letter-spacing:1px}
header p{margin:5px 0 0;color:var(--muted);font-size:11px;letter-spacing:1px}
.panel{padding:16px;margin-bottom:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px;line-height:1.5}
#reader{min-height:50px;overflow:hidden;border:1px solid #414141;border-radius:10px;background:#080808}
#reader video{width:100%!important;max-height:380px;object-fit:cover}
#reader button{background:var(--light);color:#111}
.buttons,.search{display:flex;gap:9px;margin-top:12px}
button{border:0;border-radius:9px;min-height:45px;padding:11px 14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.buttons button{flex:1}
.primary{background:var(--gold);color:#111}
.secondary{background:#393939;color:white}
input{flex:1;width:100%;min-width:0;padding:13px;border:1px solid #4a4a4a;border-radius:9px;background:#111;color:white;font-size:16px;text-transform:uppercase}
#status,#cameraStatus{color:var(--muted);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.error{color:var(--red)!important}.success{color:var(--green)!important}
.empty{text-align:center;color:var(--muted);padding:20px 4px;line-height:1.6;overflow-wrap:anywhere}
.item-id{font-size:27px;font-weight:800;color:var(--light);overflow-wrap:anywhere}
.badge{display:inline-block;margin:9px 0 12px;padding:6px 10px;border:1px solid #5b4a2d;border-radius:20px;background:#302719;color:var(--light);font-size:11px;font-weight:bold}
.detail{display:grid;grid-template-columns:minmax(105px,38%) minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.label{color:var(--muted);font-size:12px;line-height:1.5}
.value{font-size:14px;font-weight:600;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.prices{margin-top:18px;padding:16px;border:1px solid #5b4a2d;border-radius:12px;background:#211d16}
.prices h3,.linked h3{margin:0 0 12px;color:var(--light);font-size:15px}
.price-label{font-size:12px;color:var(--muted)}
.wholesale{font-size:clamp(28px,7vw,36px);font-weight:800;color:var(--light);margin-top:4px;overflow-wrap:anywhere}
.retail{font-size:14px;color:#d0ccc3;margin-top:12px;overflow-wrap:anywhere}
.linked{margin-top:20px;padding-top:16px;border-top:1px solid #51432d}
.card{padding:12px;margin-top:9px;border:1px solid #414141;border-radius:10px;background:#292929}
.card-title{color:var(--light);font-size:14px;font-weight:bold;margin-bottom:7px}
.note{padding:10px;margin-top:10px;background:#29251d;border-left:3px solid var(--gold);font-size:13px;line-height:1.5}
.photo{display:block;max-width:100%;max-height:280px;margin:14px auto;object-fit:contain}
footer{text-align:center;color:#79766f;font-size:11px;padding:10px}
@media(max-width:420px){body{padding:12px 9px 24px}.panel{padding:13px}h1{font-size:17px}.detail{grid-template-columns:1fr;gap:3px}}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">S</div>
  <div><h1>SUTARIYA JEWELS</h1><p>JEWELRY &amp; DIAMOND INVENTORY</p></div>
</header>

<section class="panel">
  <h2>▦ Scan an item</h2>
  <p class="sub">Scan a jewelry tag or diamond QR code/barcode.</p>
  <div id="reader"></div>
  <div class="buttons">
    <button id="start" class="primary" type="button">Start Camera</button>
    <button id="stop" class="secondary" type="button" disabled>Stop Camera</button>
  </div>
  <p id="cameraStatus" aria-live="polite">Camera is stopped.</p>
</section>

<section class="panel">
  <h2>⌕ Find an item</h2>
  <form id="form">
    <div class="search">
      <input id="itemId" placeholder="SB001 or SJD-O07" autocomplete="off" autocapitalize="characters">
      <button id="search" class="primary" type="submit">Search</button>
    </div>
  </form>
  <p id="status" aria-live="polite">Ready to search inventory.</p>
</section>

<section class="panel">
  <div id="result" aria-live="polite"><div class="empty">Scan a tag or enter an item ID to view details and prices.</div></div>
</section>
<footer>SUTARIYA JEWELS · INVENTORY SYSTEM</footer>
</main>

<script>
"use strict";

const API_URL="https://script.google.com/macros/s/AKfycbxv4btjp3Uc5rDB1reFRN2Ykd0lYviCw_cEtkGj6Uf44Cos9oWtKwo7wVVWBoRKys1X/exec";
const $=id=>document.getElementById(id);
let scanner=null,cameraRunning=false,cameraBusy=false,searching=false,callbackNo=0,lastCode="",lastTime=0;

function cleanId(v){
  return String(v||"").trim().replace(/^[\s"'`]+|[\s"'`]+$/g,"").toUpperCase();
}
function setStatus(msg,type){
  $("status").textContent=msg;
  $("status").className=type||"";
}
function setCamera(msg,type){
  $("cameraStatus").textContent=msg;
  $("cameraStatus").className=type||"";
}
function showMessage(msg){
  $("result").replaceChildren();
  const d=document.createElement("div");
  d.className="empty";
  d.textContent=msg;
  $("result").appendChild(d);
}
function updateButtons(){
  $("start").disabled=cameraRunning||cameraBusy;
  $("stop").disabled=!cameraRunning||cameraBusy;
  $("search").disabled=searching;
  $("start").textContent=cameraBusy?"Please wait":cameraRunning?"Camera Running":"Start Camera";
  $("search").textContent=searching?"Searching...":"Search";
}

async function startCamera(){
  if(cameraRunning||cameraBusy)return;
  cameraBusy=true;
  updateButtons();
  setCamera("Requesting camera access...");
  try{
    if(typeof Html5Qrcode==="undefined"){
      throw Error("Scanner library failed to load. Refresh the page and try again.");
    }
    if(!scanner)scanner=new Html5Qrcode("reader",{verbose:false});
    const formats=[
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF
    ];
    await scanner.start(
      {facingMode:"environment"},
      {
        fps:10,
        formatsToSupport:formats,
        qrbox:(w,h)=>{
          const s=Math.max(120,Math.min(280,Math.floor(Math.min(w,h)*.75)));
          return{width:s,height:s};
        },
        aspectRatio:1
      },
      code=>onDetected(code),
      ()=>{}
    );
    cameraRunning=true;
    setCamera("Camera ready. Scan an item.","success");
  }catch(e){
    setCamera("Could not start camera: "+(e.message||e),"error");
    try{if(scanner)await scanner.clear()}catch(_){}
    scanner=null;
    cameraRunning=false;
  }finally{
    cameraBusy=false;
    updateButtons();
  }
}
async function stopCamera(){
  if(cameraBusy)return;
  cameraBusy=true;
  updateButtons();
  try{
    if(scanner){
      if(cameraRunning){try{await scanner.stop()}catch(_){}}
      try{await scanner.clear()}catch(_){}
      scanner=null;
    }
    cameraRunning=false;
    setCamera("Camera stopped.","success");
  }finally{
    cameraBusy=false;
    updateButtons();
  }
}
async function onDetected(raw){
  const id=cleanId(raw),now=Date.now();
  if(!id||searching||cameraBusy)return;
  if(id===lastCode&&now-lastTime<1800)return;
  lastCode=id;
  lastTime=now;
  $("itemId").value=id;
  await stopCamera();
  await lookup(id);
}
function apiLookup(id){
  return new Promise((resolve,reject)=>{
    const cb="sjdCallback"+Date.now()+"_"+(++callbackNo);
    const script=document.createElement("script");
    let done=false;
    const timeout=setTimeout(()=>finish(Error("Apps Script timed out. Check deployment access and URL.")),15000);
    function cleanup(){
      clearTimeout(timeout);
      script.remove();
      try{delete window[cb]}catch(_){window[cb]=undefined}
    }
    function finish(err,data){
      if(done)return;
      done=true;
      cleanup();
      err?reject(err):resolve(data);
    }
    window[cb]=data=>finish(null,data);
    script.onerror=()=>finish(Error("Cannot connect to Apps Script. Verify the deployment URL and access."));
    script.src=API_URL+"?api=1&code="+encodeURIComponent(id)+"&callback="+encodeURIComponent(cb)+"&_="+Date.now();
    document.head.appendChild(script);
  });
}
async function lookup(raw){
  const id=cleanId(raw===undefined?$("itemId").value:raw);
  if(!id){showMessage("Enter or scan an item ID first.");return}
  if(searching)return;
  $("itemId").value=id;
  searching=true;
  updateButtons();
  setStatus("Searching inventory...");
  showMessage("Searching for "+id+"...");
  try{
    const data=await apiLookup(id);
    if(!data||data.found!==true){
      setStatus("Item not found.","error");
      showMessage(data&&data.message?data.message:"No item found for "+id);
      return;
    }
    setStatus("Inventory connection successful.","success");
    renderItem(data);
  }catch(e){
    setStatus("Inventory connection failed.","error");
    showMessage(e.message||String(e));
  }finally{
    searching=false;
    updateButtons();
  }
}

function norm(v){
  return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");
}
function privateField(key){
  const n=norm(key);
  return ["cost","margin","profit","landedcost","finalprice","priceperct","sellingprice","wholesaleprice","retailprice"]
    .some(x=>n===x||n.startsWith(x));
}
function addDetail(parent,label,value){
  if(value===null||value===undefined||String(value).trim()==="")return;
  const row=document.createElement("div");
  row.className="detail";
  const l=document.createElement("div");
  l.className="label";
  l.textContent=label;
  const v=document.createElement("div");
  v.className="value";
  v.textContent=String(value);
  row.append(l,v);
  parent.appendChild(row);
}
function showRecord(parent,record){
  if(!record||typeof record!=="object")return;
  Object.keys(record).forEach(key=>{
    const n=norm(key),value=record[key];
    if(privateField(key)||
       ["photo","image","photourl","imageurl","barcodeimage"].includes(n)||
       value===null||value===undefined||String(value).trim()===""||
       typeof value==="object")return;
    addDetail(parent,key,value);
  });
}
function cad(value){
  if(value===null||value===undefined||String(value).trim()==="")return "";
  const n=Number(String(value).replace(/[$,\s]/g,""));
  return Number.isFinite(n)
    ?n.toLocaleString("en-CA",{style:"currency",currency:"CAD"})
    :String(value);
}
function showPrices(parent,pricing){
  if(!pricing)return;
  const w=pricing.wholesalePrice,r=pricing.retailPrice;
  const hasW=w!==null&&w!==undefined&&String(w).trim()!=="";
  const hasR=r!==null&&r!==undefined&&String(r).trim()!=="";
  if(!hasW&&!hasR)return;
  const box=document.createElement("div");
  box.className="prices";
  const h=document.createElement("h3");
  h.textContent="Selling Prices";
  box.appendChild(h);
  if(hasW){
    const label=document.createElement("div");
    label.className="price-label";
    label.textContent="Wholesale selling price";
    const p=document.createElement("div");
    p.className="wholesale";
    p.textContent=cad(w);
    box.append(label,p);
  }
  if(hasR){
    const p=document.createElement("div");
    p.className="retail";
    p.textContent="Retail reference: "+cad(r);
    box.appendChild(p);
  }
  parent.appendChild(box);
}
function linkedCard(title,record,pricing){
  const card=document.createElement("div");
  card.className="card";
  const h=document.createElement("div");
  h.className="card-title";
  h.textContent=title;
  card.appendChild(h);
  showRecord(card,record);
  showPrices(card,pricing);
  return card;
}

/*
 * The API must supply data.landedCostPerCarat for this key to appear.
 * The value must be CAD per carat, not total cost or selling price.
 * Example: 82.50 becomes K8250.
 * This modifies only the displayed ID, not the lookup ID.
 */
function displayIdWithCostKey(id,data){
  const originalId=String(id||"");
  if(String(data.recordType||"").toUpperCase()!=="DIAMOND")return originalId;

  const raw=data.landedCostPerCarat;
  if(raw===null||raw===undefined||String(raw).trim()==="")return originalId;

  const costPerCarat=Number(raw);
  if(!Number.isFinite(costPerCarat)||costPerCarat<0)return originalId;

  return originalId+"-K"+Math.round(costPerCarat*100);
}

function renderItem(data){
  const root=$("result");
  root.replaceChildren();

  const record=data.record||{};
  const isDiamond=String(data.recordType||"").toUpperCase()==="DIAMOND";

  const h=document.createElement("h2");
  h.textContent=isDiamond?"Diamond Details":"Jewelry Details";
  root.appendChild(h);

  // Original ID is used for lookup; the suffix changes display only.
  const originalId=data.id||$("itemId").value;
  const id=document.createElement("div");
  id.className="item-id";
  id.textContent=displayIdWithCostKey(originalId,data);
  root.appendChild(id);

  const badge=document.createElement("span");
  badge.className="badge";
  badge.textContent=isDiamond?"DIAMOND / STONE":"FINISHED JEWELRY";
  root.appendChild(badge);

  showRecord(root,record);
  showPrices(root,data.pricing);

  const photoUrl=data.photoUrl||"";
  if(/^https?:\/\//i.test(photoUrl)){
    if(/\.(png|jpe?g|gif|webp|avif)(\?.*)?$/i.test(photoUrl)){
      const img=document.createElement("img");
      img.className="photo";
      img.alt="Item photo";
      img.src=photoUrl;
      img.onerror=()=>img.remove();
      root.appendChild(img);
    }else{
      const a=document.createElement("a");
      a.href=photoUrl;
      a.target="_blank";
      a.rel="noopener noreferrer";
      a.textContent="Open product/photo link";
      a.style.color="#e7cc91";
      root.appendChild(a);
    }
  }

  if(Array.isArray(data.linkedDiamonds)&&data.linkedDiamonds.length){
    const section=document.createElement("div");
    section.className="linked";
    const heading=document.createElement("h3");
    heading.textContent="Diamonds assigned to this jewelry ("+data.linkedDiamonds.length+")";
    section.appendChild(heading);

    data.linkedDiamonds.forEach(stone=>{
      section.appendChild(
        linkedCard("Stone ID: "+(stone.id||"Unknown"),stone.record,stone.pricing)
      );
    });
    root.appendChild(section);
  }

  if(isDiamond){
    const lj=data.linkedJewelry;
    if(lj&&lj.found){
      const section=document.createElement("div");
      section.className="linked";
      const heading=document.createElement("h3");
      heading.textContent="Used in this jewelry";
      section.appendChild(heading);

      const note=document.createElement("div");
      note.className="note";
      note.textContent="This diamond is assigned to jewelry ID "+lj.id+".";
      section.appendChild(note);
      section.appendChild(linkedCard("Jewelry ID: "+lj.id,lj.record,null));

      if(Array.isArray(lj.linkedDiamonds)&&lj.linkedDiamonds.length){
        const subheading=document.createElement("h3");
        subheading.style.marginTop="16px";
        subheading.textContent="All diamonds assigned to "+lj.id;
        section.appendChild(subheading);

        lj.linkedDiamonds.forEach(stone=>{
          section.appendChild(
            linkedCard("Stone ID: "+(stone.id||"Unknown"),stone.record,stone.pricing)
          );
        });
      }
      root.appendChild(section);
    }else if(data.linkedJewelryId){
      const note=document.createElement("div");
      note.className="note";
      note.textContent="Assigned Jewelry ID: "+data.linkedJewelryId+
        ". Matching jewelry record was not found.";
      root.appendChild(note);
    }else{
      const note=document.createElement("div");
      note.className="note";
      note.textContent="No Jewelry ID is assigned. This appears to be a loose or unassigned stone.";
      root.appendChild(note);
    }
  }
}

$("form").addEventListener("submit",e=>{
  e.preventDefault();
  lookup();
});
$("start").addEventListener("click",startCamera);
$("stop").addEventListener("click",stopCamera);
$("itemId").addEventListener("input",()=>{
  lastCode="";
  lastTime=0;
});
window.addEventListener("pagehide",()=>{
  if(scanner&&cameraRunning)scanner.stop().catch(()=>{});
});
updateButtons();
</script>
</body>
</html>
